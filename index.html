<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام شحن متكامل</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}

body{
background:#0f172a;
color:white;
}

.hidden{display:none}

/* ===== LOGIN ===== */
#login{
max-width:400px;
margin:100px auto;
background:white;
color:black;
padding:30px;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1d4ed8;
transform:scale(1.05);
}

/* ===== DASHBOARD ===== */

.container{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#111827;
padding:20px;
}

.sidebar a{
display:block;
padding:12px;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
}

.sidebar a:hover{
background:#2563eb;
}

/* CONTENT */

.content{
flex:1;
padding:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

/* MOBILE */

@media(max-width:900px){
.container{
flex-direction:column;
}
.sidebar{
width:100%;
}
}
</style>

</head>
<body>

<!-- ================= LOGIN ================= -->

<div id="login">

<h2>🚀 تسجيل الدخول</h2>

<h3>دخول الادمن</h3>
<input id="adminPass" type="password" placeholder="كلمة السر">
<button onclick="adminLogin()">دخول</button>

<hr>

<h3>دخول المكتب</h3>
<input id="officeName" placeholder="اسم المكتب">
<input id="officeKey" type="password" placeholder="كلمة السر">
<button onclick="officeLogin()">دخول</button>

</div>

<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="hidden">

<div class="container">

<div class="sidebar">

<h3>لوحة التحكم</h3>

<a onclick="showSection('offices')">🏢 المكاتب</a>
<a onclick="showSection('invoices')">📦 الفواتير</a>
<a onclick="showSection('chat')">💬 الدردشة</a>
<a onclick="logout()">🚪 خروج</a>

</div>

<div class="content">

<!-- OFFICES -->
<div id="offices" class="card section">
<h3>إدارة المكاتب</h3>

<input id="newOfficeName" placeholder="اسم المكتب">
<input id="newOfficePass" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المحافظة">

<button onclick="createOffice()">إنشاء مكتب</button>

<hr>
<div id="officeList"></div>
</div>

<!-- INVOICES -->
<div id="invoices" class="card section hidden">
<h3>الفواتير</h3>

<input id="client" placeholder="اسم العميل">
<input id="items" placeholder="البضاعة">
<input id="toOffice" placeholder="اسم المكتب المستلم">

<button onclick="createInvoice()">إنشاء فاتورة</button>

<hr>
<div id="invoiceList"></div>
</div>

<!-- CHAT -->
<div id="chat" class="card section hidden">
<h3>الدردشة</h3>

<input id="chatMsg" placeholder="اكتب رسالة">
<button onclick="sendMessage()">إرسال</button>

<hr>
<div id="chatBox"></div>
</div>

</div>
</div>
</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD="22623212262321";

let currentUser="";
let role="";

/* ================= LOGIN ================= */

window.adminLogin = async function(){

let pass = adminPass.value.trim();

if(pass === ADMIN_PASSWORD){

role="admin";
login.classList.add("hidden");
dashboard.classList.remove("hidden");

loadOffices();
loadInvoices();
listenChat();

}else{
alert("كلمة السر خطأ ❌");
}

}

window.officeLogin = async function(){

let name = officeName.value.trim();
let pass = officeKey.value.trim();

let q = query(collection(db,"offices"),where("name","==",name));
let snap = await getDocs(q);

if(snap.empty){
alert("المكتب غير موجود");
return;
}

let officeData = null;

snap.forEach(d=>officeData=d.data());

if(officeData.password === pass){

role="office";
currentUser=name;

login.classList.add("hidden");
dashboard.classList.remove("hidden");

loadInvoices();

}else{
alert("كلمة السر خطأ");
}

}

/* ================= SIDEBAR ================= */

window.showSection=function(id){

document.querySelectorAll(".section")
.forEach(sec=>sec.classList.add("hidden"));

document.getElementById(id).classList.remove("hidden");

}

window.logout=function(){
location.reload();
}

/* ================= OFFICES ================= */

window.createOffice = async function(){

await addDoc(collection(db,"offices"),{
name:newOfficeName.value,
password:newOfficePass.value,
country:country.value,
region:region.value,
status:"active"
});

alert("تم إنشاء المكتب");
loadOffices();

}

async function loadOffices(){

let snap = await getDocs(collection(db,"offices"));
officeList.innerHTML="";

snap.forEach(d=>{
let data=d.data();

officeList.innerHTML+=`
<div>
<b>${data.name}</b>
| ${data.country}
| ${data.region}
</div>
<hr>
`;
});
}

/* ================= INVOICES ================= */

window.createInvoice = async function(){

let code="INV-"+Math.floor(Math.random()*999999);

await addDoc(collection(db,"invoices"),{
code,
client:client.value,
items:items.value,
toOffice:toOffice.value,
from:role,
status:"pending",
createdAt:new Date()
});

alert("تم إنشاء الفاتورة");
loadInvoices();

}

async function loadInvoices(){

let snap = await getDocs(collection(db,"invoices"));
invoiceList.innerHTML="";

snap.forEach(d=>{
let data=d.data();

invoiceList.innerHTML+=`
<div>
<b>${data.code}</b>
| ${data.client}
| ${data.status}
</div>
<hr>
`;
});
}

/* ================= CHAT ================= */

window.sendMessage = async function(){

await addDoc(collection(db,"chat"),{
sender:role,
message:chatMsg.value,
time:new Date()
});

chatMsg.value="";
}

function listenChat(){

onSnapshot(collection(db,"chat"),snap=>{
chatBox.innerHTML="";
snap.forEach(d=>{
let data=d.data();
chatBox.innerHTML+=`
<b>${data.sender}</b>:
${data.message}
<hr>
`;
});
});

}

</script>

</body>
</html>
