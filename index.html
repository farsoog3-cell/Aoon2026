<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الشحن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#f1f5f9;
color:#1e293b;
}

button{
cursor:pointer;
border:none;
}

input,select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #cbd5f5;
margin-bottom:10px;
font-family:inherit;
}

/* LOGIN */
.login{
max-width:360px;
margin:80px auto;
background:#fff;
padding:30px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.primary{
background:#2563eb;
color:#fff;
padding:10px;
border-radius:8px;
width:100%;
}

.secondary{
background:#0f172a;
color:#fff;
padding:10px;
border-radius:8px;
width:100%;
margin-top:10px;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:0;
height:100vh;
width:240px;
background:#0f172a;
color:#fff;
padding:20px;
transition:.3s;
}

.sidebar.closed{
transform:translateX(100%);
}

.sidebar a{
display:block;
padding:10px;
border-radius:8px;
color:#e2e8f0;
text-decoration:none;
margin-bottom:6px;
}

.sidebar a:hover{
background:#1e293b;
}

/* CONTENT */
.content{
padding:20px;
margin-right:240px;
transition:.3s;
}

.content.full{
margin-right:0;
}

.topbar{
height:60px;
background:#fff;
display:flex;
align-items:center;
padding:0 20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.menuBtn{
background:#2563eb;
color:#fff;
padding:6px 12px;
border-radius:8px;
font-size:18px;
}

.card{
background:#fff;
padding:20px;
border-radius:14px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.listItem{
padding:10px;
border-bottom:1px solid #e2e8f0;
}

.smallBtn{
background:#ef4444;
color:#fff;
border-radius:6px;
padding:5px 8px;
font-size:12px;
}

.pdfBtn{
background:#10b981;
color:#fff;
border-radius:6px;
padding:5px 8px;
font-size:12px;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
<h2>تسجيل الدخول</h2>

<input id="officeName" placeholder="اسم المكتب">
<input id="officeKey" placeholder="كلمة السر">

<button class="primary" onclick="officeLogin()">دخول مكتب</button>
<button class="secondary" onclick="adminLogin()">دخول المدير العام</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<div class="sidebar" id="adminSidebar">
<h3>لوحة المدير</h3>

<a onclick="show('createInvoice')">إنشاء فاتورة</a>
<a onclick="show('createOffice')">إنشاء مكتب</a>
<a onclick="show('allInvoices')">كل الفواتير</a>
<a onclick="show('accounts')">حسابات المكاتب</a>

</div>

<div class="content" id="adminContent">

<div class="topbar">
<button class="menuBtn" onclick="toggleSidebar('admin')">☰</button>
</div>

<div id="createInvoice" class="card">
<h3>إنشاء فاتورة</h3>

<input id="client" placeholder="اسم العميل">
<input id="items" placeholder="البضاعة">
<select id="targetOffice"></select>

<button class="primary" onclick="createInvoice()">حفظ الفاتورة</button>
</div>

<div id="createOffice" class="card hidden">
<h3>إنشاء مكتب</h3>

<input id="newOfficeName" placeholder="اسم المكتب">
<input id="newOfficeKey" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المنطقة">

<button class="primary" onclick="createOffice()">إنشاء</button>
</div>

<div id="allInvoices" class="card hidden">
<h3>كل الفواتير</h3>
<div id="invoiceList"></div>
</div>

<div id="accounts" class="card hidden">
<h3>المكاتب</h3>
<div id="officeList"></div>
</div>

</div>
</div>

<script>

const ADMIN_PASSWORD="22623212262321"

let offices=JSON.parse(localStorage.getItem('offices')||'[]')
let invoices=JSON.parse(localStorage.getItem('invoices')||'[]')
let currentOffice=null

/* -------- LOGIN -------- */

function adminLogin(){
let pass=prompt("ادخل كلمة مرور المدير")
if(pass===ADMIN_PASSWORD){
login.style.display="none"
adminPanel.classList.remove("hidden")
refreshOffices()
renderInvoices()
}
}

function officeLogin(){
let name=officeName.value
let key=officeKey.value

let office=offices.find(o=>o.name===name && o.key===key)

if(office){
currentOffice=name
office.active=true
localStorage.setItem("offices",JSON.stringify(offices))

login.style.display="none"
alert("تم الدخول")
}else{
alert("بيانات غير صحيحة")
}
}

/* -------- OFFICE -------- */

function createOffice(){
let name=newOfficeName.value
let key=newOfficeKey.value
let country=country.value
let region=region.value

offices.push({name,key,country,region,active:false})
localStorage.setItem("offices",JSON.stringify(offices))

refreshOffices()
alert("تم إنشاء المكتب")
}

function refreshOffices(){
let select=targetOffice
let list=officeList

select.innerHTML=""
list.innerHTML=""

offices.forEach(o=>{
let op=document.createElement("option")
op.value=o.name
op.textContent=o.name
select.appendChild(op)

let div=document.createElement("div")
div.className="listItem"
div.textContent=`${o.name} | ${o.country} | ${o.region}`
list.appendChild(div)
})
}

/* -------- INVOICE -------- */

function createInvoice(){

let client=document.getElementById("client").value
let items=document.getElementById("items").value
let office=targetOffice.value

let code="INV-"+Math.floor(Math.random()*1000000)

invoices.push({
client,
items,
office,
code,
date:new Date().toLocaleDateString()
})

localStorage.setItem("invoices",JSON.stringify(invoices))

renderInvoices()
alert("تم إنشاء الفاتورة")
}

function renderInvoices(){
invoiceList.innerHTML=""

invoices.forEach((i,index)=>{

let div=document.createElement("div")
div.className="listItem"

div.innerHTML=`
${i.code} | ${i.client} | ${i.office}
<button class="smallBtn" onclick="deleteInvoice(${index})">حذف</button>
`

invoiceList.appendChild(div)
})
}

function deleteInvoice(index){
invoices.splice(index,1)
localStorage.setItem("invoices",JSON.stringify(invoices))
renderInvoices()
}

/* -------- SIDEBAR -------- */

function toggleSidebar(type){
if(type==="admin"){
adminSidebar.classList.toggle("closed")
adminContent.classList.toggle("full")
}
}

function show(id){
["createInvoice","createOffice","allInvoices","accounts"]
.forEach(s=>{
let el=document.getElementById(s)
if(el) el.classList.add("hidden")
})

document.getElementById(id).classList.remove("hidden")
}

</script>

</body>
</html>
