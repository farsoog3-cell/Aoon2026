<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم احترافية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}

body{
background:#f1f5f9;
}

/* LOGIN */
#login{
max-width:350px;
margin:120px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
#login input,#login button{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ddd;
}
.primary{
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

/* LAYOUT */
.container{
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#0f172a;
color:white;
padding:20px;
transition:0.3s;
}

.sidebar h3{
margin-bottom:20px;
}

.sidebar a{
display:block;
padding:10px;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
}

.sidebar a:hover{
background:#1e293b;
}

/* زر فتح/إغلاق */
.toggleBtn{
display:none;
background:#2563eb;
color:white;
padding:8px;
border-radius:6px;
cursor:pointer;
margin-bottom:10px;
}

/* CONTENT */
.content{
flex:1;
padding:25px;
overflow:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
margin-bottom:20px;
}

.hidden{
display:none;
}

/* RESPONSIVE */
@media(max-width:900px){
.sidebar{
position:absolute;
height:100%;
transform:translateX(100%);
}

.sidebar.open{
transform:translateX(0);
}

.toggleBtn{
display:inline-block;
}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<h2>تسجيل الدخول</h2>

<input id="adminPass" type="password" placeholder="كلمة سر الادمن">
<button class="primary" onclick="adminLogin()">دخول الادمن</button>
</div>

<!-- لوحة التحكم -->
<div id="dashboard" class="hidden">

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<h3>لوحة التحكم</h3>

<span class="toggleBtn" onclick="toggleSidebar()">☰ إغلاق</span>

<a onclick="showSection('offices')">🏢 المكاتب</a>
<a onclick="showSection('invoices')">📦 الفواتير</a>
<a onclick="showSection('chat')">💬 الدردشة</a>

</div>

<!-- CONTENT -->
<div class="content">

<span class="toggleBtn" onclick="toggleSidebar()">☰ فتح القائمة</span>

<!-- ========== المكاتب ========== -->
<div id="offices" class="card section">
<h3>إدارة المكاتب</h3>

<input id="officeName" placeholder="اسم المكتب">
<input id="officePass" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المحافظة">

<button class="primary" onclick="createOffice()">إنشاء مكتب</button>

<hr>
<div id="officeList"></div>
</div>

<!-- ========== الفواتير ========== -->
<div id="invoices" class="card section hidden">
<h3>إدارة الفواتير</h3>

<input id="client" placeholder="اسم العميل">
<input id="items" placeholder="البضاعة">
<input id="officeTarget" placeholder="اسم المكتب المستهدف">

<button class="primary" onclick="createInvoice()">إنشاء فاتورة</button>

<hr>
<div id="invoiceList"></div>
</div>

<!-- ========== الدردشة ========== -->
<div id="chat" class="card section hidden">
<h3>الدردشة</h3>

<input id="chatMsg" placeholder="اكتب رسالة">
<button class="primary" onclick="sendMessage()">إرسال</button>

<hr>
<div id="chatBox" style="height:300px;overflow:auto"></div>
</div>

</div>
</div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore,
collection, addDoc, getDocs, deleteDoc, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"API_KEY",
authDomain:"man-7f10b.firebaseapp.com",
projectId:"man-7f10b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD="22623212262321";

/* ========= LOGIN ========= */
window.adminLogin=function(){

let pass=document.getElementById("adminPass").value.trim();

if(pass===ADMIN_PASSWORD){

login.classList.add("hidden");
dashboard.classList.remove("hidden");

loadOffices();
loadInvoices();
listenChat();

}else{
alert("كلمة السر خطأ ❌");
}
}

/* ========= SIDEBAR ========= */
window.toggleSidebar=function(){
document.getElementById("sidebar").classList.toggle("open");
}

window.showSection=function(id){

document.querySelectorAll(".section").forEach(sec=>{
sec.classList.add("hidden");
});

document.getElementById(id).classList.remove("hidden");
}

/* ========= OFFICES ========= */
window.createOffice=async function(){

await addDoc(collection(db,"offices"),{
name:officeName.value,
pass:officePass.value,
country:country.value,
region:region.value,
active:true
});

alert("تم إنشاء المكتب");
loadOffices();
}

async function loadOffices(){

let snap=await getDocs(collection(db,"offices"));
officeList.innerHTML="";

snap.forEach(d=>{
let data=d.data();

officeList.innerHTML+=`
<div>
<b>${data.name}</b>
| ${data.country}
| ${data.region}
</div>
<hr>
`;
});
}

/* ========= INVOICES ========= */
window.createInvoice=async function(){

let code="INV-"+Math.floor(Math.random()*999999);

await addDoc(collection(db,"invoices"),{
code:code,
client:client.value,
items:items.value,
office:officeTarget.value,
status:"sent",
date:new Date()
});

alert("تم إنشاء الفاتورة");
loadInvoices();
}

async function loadInvoices(){

let snap=await getDocs(collection(db,"invoices"));
invoiceList.innerHTML="";

snap.forEach(d=>{
let data=d.data();

invoiceList.innerHTML+=`
<div>
<b>${data.code}</b>
| ${data.client}
| ${data.office}
| الحالة: ${data.status}
</div>
<hr>
`;
});
}

/* ========= CHAT ========= */
window.sendMessage=async function(){

await addDoc(collection(db,"chat"),{
from:"admin",
msg:chatMsg.value,
time:new Date()
});

chatMsg.value="";
}

function listenChat(){

onSnapshot(collection(db,"chat"),snap=>{
chatBox.innerHTML="";
snap.forEach(d=>{
let data=d.data();
chatBox.innerHTML+=`
<b>${data.from}</b> :
${data.msg}
<hr>
`;
});
});
}

</script>

</body>
</html>
