<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الشحن - Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#f1f5f9;
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.primary{background:#2563eb;color:#fff;width:100%}
.smallBtn{background:#ef4444;color:#fff;font-size:12px}

.card{
background:#fff;
padding:20px;
margin:20px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.hidden{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card">
<h2>تسجيل الدخول</h2>

<input id="officeName" placeholder="اسم المكتب">
<input id="officeKey" placeholder="كلمة السر">

<button class="primary" onclick="officeLogin()">دخول مكتب</button>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden">

<div class="card">
<h3>إنشاء مكتب</h3>
<input id="newOfficeName" placeholder="اسم المكتب">
<input id="newOfficeKey" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المنطقة">

<button class="primary" onclick="createOffice()">إنشاء مكتب</button>
</div>

<div class="card">
<h3>إنشاء فاتورة</h3>
<input id="client" placeholder="اسم العميل">
<input id="items" placeholder="البضاعة">
<select id="targetOffice"></select>

<button class="primary" onclick="createInvoice()">حفظ الفاتورة</button>
</div>

<div class="card">
<h3>كل الفواتير</h3>
<div id="invoiceList"></div>
</div>

</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
query,
where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "API_KEY",
authDomain: "man-7f10b.firebaseapp.com",
projectId: "man-7f10b",
storageBucket: "man-7f10b.appspot.com",
messagingSenderId: "442792808025",
appId: "1:442792808025:web:f85f15a8d0652bd232eb48"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= OFFICE ================= */

window.createOffice = async function(){

let name = document.getElementById("newOfficeName").value
let key = document.getElementById("newOfficeKey").value
let country = document.getElementById("country").value
let region = document.getElementById("region").value

await addDoc(collection(db,"offices"),{
name,key,country,region
})

alert("تم إنشاء المكتب")
loadOffices()
}

/* ================= LOAD OFFICES ================= */

async function loadOffices(){

let select = document.getElementById("targetOffice")
select.innerHTML=""

let snapshot = await getDocs(collection(db,"offices"))

snapshot.forEach(docSnap=>{
let data = docSnap.data()

let option = document.createElement("option")
option.value = data.name
option.textContent = data.name

select.appendChild(option)
})
}

window.officeLogin = async function(){

let name = document.getElementById("officeName").value
let key = document.getElementById("officeKey").value

let q = query(collection(db,"offices"),
where("name","==",name),
where("key","==",key))

let snap = await getDocs(q)

if(!snap.empty){
document.getElementById("login").classList.add("hidden")
document.getElementById("adminPanel").classList.remove("hidden")
loadOffices()
loadInvoices()
}else{
alert("بيانات غير صحيحة")
}
}

/* ================= INVOICE ================= */

window.createInvoice = async function(){

let client = document.getElementById("client").value
let items = document.getElementById("items").value
let office = document.getElementById("targetOffice").value

let code = "INV-"+Math.floor(Math.random()*1000000)

await addDoc(collection(db,"invoices"),{
client,
items,
office,
code,
date:new Date().toLocaleDateString()
})

alert("تم حفظ الفاتورة")
loadInvoices()
}

/* ================= LOAD INVOICES ================= */

async function loadInvoices(){

let list = document.getElementById("invoiceList")
list.innerHTML=""

let snapshot = await getDocs(collection(db,"invoices"))

snapshot.forEach(docSnap=>{
let data = docSnap.data()

let div = document.createElement("div")
div.style.padding="10px"
div.style.borderBottom="1px solid #ddd"

div.innerHTML = `
<b>${data.code}</b> | ${data.client} | ${data.office}
<button class="smallBtn" onclick="deleteInvoice('${docSnap.id}')">
حذف
</button>
`

list.appendChild(div)
})
}

window.deleteInvoice = async function(id){

await deleteDoc(doc(db,"invoices",id))
alert("تم الحذف")
loadInvoices()
}

/* تحميل البيانات عند فتح الصفحة */
loadOffices()

</script>

</body>
</html>
