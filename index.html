<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام شحن احترافي</title>

<style>
body{font-family:Cairo;background:#f1f5f9;margin:0}
input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}
.primary{background:#2563eb;color:white;width:100%}
.card{
background:white;
margin:20px;
padding:20px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,0.05)
}
.hidden{display:none}
</style>

</head>
<body>

<!-- ================= LOGIN ================= -->

<div id="login" class="card">
<h2>تسجيل الدخول</h2>

<input id="officeName" placeholder="اسم المكتب">
<input id="officeKey" type="password" placeholder="كلمة السر">

<button class="primary" onclick="officeLogin()">دخول مكتب</button>

<hr>

<h3>دخول الادمن</h3>
<input id="adminPass" type="password" placeholder="كلمة سر الادمن">
<button class="primary" onclick="adminLogin()">دخول الادمن</button>
</div>

<!-- ================= ADMIN PANEL ================= -->

<div id="adminPanel" class="hidden">

<div class="card">
<h2>لوحة التحكم - الادمن</h2>

<h3>إنشاء مكتب</h3>
<input id="newOfficeName" placeholder="اسم المكتب">
<input id="newOfficePass" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المحافظة">

<button class="primary" onclick="createOffice()">إنشاء مكتب</button>
</div>

<div class="card">
<h3>إنشاء فاتورة وإرسالها</h3>
<input id="invoiceClient" placeholder="اسم العميل">
<input id="invoiceItems" placeholder="البضاعة">
<select id="selectOffice"></select>
<button class="primary" onclick="createInvoice()">إنشاء وإرسال</button>
</div>

<div class="card">
<h3>كل الفواتير</h3>
<input id="searchCode" placeholder="بحث بالكود">
<button class="primary" onclick="searchInvoice()">بحث</button>
<div id="invoiceList"></div>
</div>

</div>

<!-- ================= OFFICE PANEL ================= -->

<div id="officePanel" class="hidden">

<div class="card">
<h2>لوحة المكتب</h2>

<h3>فواتيري</h3>
<input id="searchMyInvoice" placeholder="بحث بالكود">
<button class="primary" onclick="searchMyInvoice()">بحث</button>

<div id="myInvoices"></div>

<hr>

<h3>دردشة مع الادمن</h3>
<input id="chatMsg" placeholder="اكتب رسالة">
<button class="primary" onclick="sendMessage()">إرسال</button>
<div id="chatBox"></div>

</div>

</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore,
collection,
addDoc,
getDocs,
query,
where,
deleteDoc,
doc,
updateDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"API_KEY",
authDomain:"man-7f10b.firebaseapp.com",
projectId:"man-7f10b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD="2262623212262321";

let currentOffice="";

/* ================= LOGIN ================= */

window.adminLogin = async function(){

let pass=document.getElementById("adminPass").value;

if(pass===ADMIN_PASSWORD){
login.classList.add("hidden")
adminPanel.classList.remove("hidden")
loadOffices()
loadInvoices()
}else{
alert("كلمة السر خطأ")
}
}

window.officeLogin = async function(){

let name=document.getElementById("officeName").value;
let key=document.getElementById("officeKey").value;

let q=query(collection(db,"offices"),
where("name","==",name),
where("key","==",key));

let snap=await getDocs(q);

if(!snap.empty){
currentOffice=name;
login.classList.add("hidden");
officePanel.classList.remove("hidden");
loadMyInvoices();
listenChat();
}else{
alert("بيانات غير صحيحة")
}
}

/* ================= OFFICES ================= */

window.createOffice = async function(){

await addDoc(collection(db,"offices"),{
name:newOfficeName.value,
key:newOfficePass.value,
country:country.value,
region:region.value,
active:true
})

alert("تم إنشاء المكتب")
loadOffices()
}

async function loadOffices(){
let snap=await getDocs(collection(db,"offices"))
let select=document.getElementById("selectOffice")
select.innerHTML=""
snap.forEach(d=>{
let data=d.data()
let opt=document.createElement("option")
opt.value=data.name
opt.textContent=data.name
select.appendChild(opt)
})
}

/* ================= INVOICES ================= */

window.createInvoice = async function(){

let code="INV-"+Math.floor(Math.random()*999999)

await addDoc(collection(db,"invoices"),{
code,
client:invoiceClient.value,
items:invoiceItems.value,
office:selectOffice.value,
status:"sent",
from:"admin"
})

alert("تم ارسال الفاتورة")
loadInvoices()
}

async function loadInvoices(){

let snap=await getDocs(collection(db,"invoices"))
let list=document.getElementById("invoiceList")
list.innerHTML=""

snap.forEach(d=>{
let data=d.data()

let div=document.createElement("div")
div.innerHTML=`
<b>${data.code}</b> | ${data.client} | ${data.office}
 | الحالة: ${data.status}
`
list.appendChild(div)
})
}

window.searchInvoice = async function(){

let code=searchCode.value
let q=query(collection(db,"invoices"),where("code","==",code))
let snap=await getDocs(q)

invoiceList.innerHTML=""

snap.forEach(d=>{
invoiceList.innerHTML+=`
<b>${d.data().code}</b>
<br>
${JSON.stringify(d.data())}
<hr>
`
})
}

/* ================= OFFICE FUNCTIONS ================= */

async function loadMyInvoices(){

let q=query(collection(db,"invoices"),
where("office","==",currentOffice))

onSnapshot(q,(snap)=>{
myInvoices.innerHTML=""
snap.forEach(d=>{
let data=d.data()
myInvoices.innerHTML+=`
<div>
<b>${data.code}</b>
${data.client}
<br>
الحالة: ${data.status}
<br>
<button onclick="approveInvoice('${d.id}')">موافقة</button>
<button onclick="deleteInvoice('${d.id}')">حذف</button>
</div>
<hr>
`
})
})
}

window.approveInvoice = async function(id){
await updateDoc(doc(db,"invoices",id),{
status:"approved"
})
}

window.deleteInvoice = async function(id){
await deleteDoc(doc(db,"invoices",id))
}

/* ================= CHAT ================= */

window.sendMessage = async function(){

await addDoc(collection(db,"chat"),{
from:currentOffice,
msg:chatMsg.value,
time:new Date()
})

chatMsg.value=""
}

function listenChat(){

onSnapshot(collection(db,"chat"),(snap)=>{
chatBox.innerHTML=""
snap.forEach(d=>{
let data=d.data()
chatBox.innerHTML+=`
<b>${data.from}</b> :
${data.msg}
<hr>
`
})
})
}

</script>

</body>
</html>
