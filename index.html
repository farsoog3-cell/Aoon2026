<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم الاحترافية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:#f1f5f9;color:#1e293b;}
.hidden{display:none;}
/* LOGIN */
#login{max-width:360px;margin:80px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);}
#login input, #login button{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;font-family:inherit;}
#login button{border:none;cursor:pointer;}
.primary{background:#2563eb;color:#fff;}
/* LAYOUT */
.container{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:250px;background:#0f172a;color:#fff;flex-shrink:0;transition:0.3s;overflow-y:auto;}
.sidebar.closed{transform:translateX(100%);}
.sidebar h3{padding:20px 10px;margin:0;font-size:20px;border-bottom:1px solid #1e293b;}
.sidebar a{display:block;padding:12px 15px;color:#e2e8f0;text-decoration:none;margin-bottom:5px;border-radius:6px;transition:0.2s;}
.sidebar a:hover{background:#1e293b;}
.content{flex:1;overflow-y:auto;padding:20px;transition:0.3s;}
.content.full{margin-left:0;}
.topbar{height:60px;background:#fff;display:flex;align-items:center;padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.menuBtn{background:#2563eb;color:#fff;padding:6px 12px;border-radius:8px;font-size:18px;cursor:pointer;}
.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.05);}
@media(max-width:768px){
.container{flex-direction:column;}
.sidebar{position:absolute;height:100%;z-index:10;}
.content{margin-left:0;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<h2>تسجيل الدخول</h2>
<input id="officeName" placeholder="اسم المكتب">
<input id="officeKey" type="password" placeholder="كلمة السر">
<button class="primary" onclick="officeLogin()">دخول مكتب</button>
<hr>
<h3>دخول الادمن</h3>
<input id="adminPass" type="password" placeholder="كلمة سر الادمن">
<button class="primary" onclick="adminLogin()">دخول الادمن</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
<div class="container">
<div class="sidebar" id="sidebar">
<h3>لوحة المدير</h3>
<a onclick="showSection('offices')">المكاتب</a>
<a onclick="showSection('invoices')">الفواتير</a>
<a onclick="showSection('chat')">الدردشة</a>
</div>
<div class="content" id="content">
<div class="topbar">
<button class="menuBtn" onclick="toggleSidebar()">☰</button>
<h2 style="margin-left:20px;">لوحة التحكم</h2>
</div>

<!-- SECTIONS -->
<div id="offices" class="card">
<h3>المكاتب</h3>
<input id="newOfficeName" placeholder="اسم المكتب">
<input id="newOfficePass" placeholder="كلمة السر">
<input id="country" placeholder="البلد">
<input id="region" placeholder="المحافظة">
<button class="primary" onclick="createOffice()">إنشاء مكتب</button>
<div id="officeList"></div>
</div>

<div id="invoices" class="card hidden">
<h3>الفواتير</h3>
<input id="invoiceClient" placeholder="اسم العميل">
<input id="invoiceItems" placeholder="البضاعة">
<select id="selectOffice"></select>
<button class="primary" onclick="createInvoice()">إنشاء وإرسال</button>
<hr>
<input id="searchCode" placeholder="بحث بالكود">
<button class="primary" onclick="searchInvoice()">بحث</button>
<div id="invoiceList"></div>
</div>

<div id="chat" class="card hidden">
<h3>الدردشة مع المكاتب</h3>
<input id="chatMsg" placeholder="اكتب رسالة">
<button class="primary" onclick="sendMessage()">إرسال</button>
<div id="chatBox" style="height:300px;overflow:auto;"></div>
</div>

</div>
</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore,
collection, addDoc, getDocs, query, where, deleteDoc, doc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = { apiKey:"API_KEY", authDomain:"man-7f10b.firebaseapp.com", projectId:"man-7f10b" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ADMIN PASSWORD
const ADMIN_PASSWORD="22623212262321";
let currentOffice="";

// LOGIN
window.adminLogin = function(){
let pass=document.getElementById("adminPass").value.trim();
if(pass===ADMIN_PASSWORD){
login.style.display="none";
adminPanel.classList.remove("hidden");
loadOffices();
loadInvoices();
listenChat();
}else alert("كلمة السر خطأ ❌");
}

window.officeLogin = async function(){
let name=officeName.value.trim(), key=officeKey.value.trim();
if(!name||!key){alert("املأ الحقول"); return;}
let q=query(collection(db,"offices"),where("name","==",name));
let snap=await getDocs(q);
if(snap.empty){alert("المكتب غير موجود"); return;}
let officeData=null;
snap.forEach(d=>{officeData=d.data(); officeData.id=d.id;});
if(officeData.key===key){currentOffice=name; login.style.display="none"; alert("تم الدخول");}
else alert("كلمة السر خطأ ❌");
}

// SIDEBAR FUNCTIONS
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("closed");}
function showSection(id){
["offices","invoices","chat"].forEach(s=>{document.getElementById(s).classList.add("hidden");});
document.getElementById(id).classList.remove("hidden");
}

// OFFICES
window.createOffice = async function(){
await addDoc(collection(db,"offices"),{
name:newOfficeName.value,key:newOfficePass.value,country:country.value,region:region.value,active:true
});alert("تم إنشاء المكتب");loadOffices();
}
async function loadOffices(){
let snap=await getDocs(collection(db,"offices"));
let select=document.getElementById("selectOffice"); let list=document.getElementById("officeList");
select.innerHTML=""; list.innerHTML="";
snap.forEach(d=>{
let data=d.data();
let opt=document.createElement("option"); opt.value=data.name; opt.textContent=data.name; select.appendChild(opt);
let div=document.createElement("div");
div.innerHTML=`<b>${data.name}</b> | ${data.country} | ${data.region} <button onclick="deleteOffice('${d.id}')">حذف</button>`;
list.appendChild(div);
});
}
window.deleteOffice=async function(id){await deleteDoc(doc(db,"offices",id));alert("تم الحذف"); loadOffices();}

// INVOICES
window.createInvoice=async function(){
let code="INV-"+Math.floor(Math.random()*999999);
await addDoc(collection(db,"invoices"),{code,client:invoiceClient.value,items:invoiceItems.value,office:selectOffice.value,status:"sent",from:"admin"});
alert("تم ارسال الفاتورة");loadInvoices();
}
async function loadInvoices(){
let snap=await getDocs(collection(db,"invoices"));
let list=document.getElementById("invoiceList"); list.innerHTML="";
snap.forEach(d=>{let data=d.data(); list.innerHTML+=`<div><b>${data.code}</b> | ${data.client} | ${data.office} | الحالة: ${data.status}</div><hr>`;});
}
window.searchInvoice=async function(){let code=searchCode.value.trim(); let q=query(collection(db,"invoices"),where("code","==",code)); let snap=await getDocs(q); invoiceList.innerHTML=""; snap.forEach(d=>{invoiceList.innerHTML+=`<pre>${JSON.stringify(d.data(),null,2)}</pre><hr>`;});}

// CHAT
window.sendMessage=async function(){await addDoc(collection(db,"chat"),{from:"admin",msg:chatMsg.value,time:new Date()}); chatMsg.value="";}
function listenChat(){onSnapshot(collection(db,"chat"),snap=>{chatBox.innerHTML=""; snap.forEach(d=>{let data=d.data(); chatBox.innerHTML+=`<b>${data.from}</b>: ${data.msg}<hr>`;});});}
</script>
</body>
</html>
